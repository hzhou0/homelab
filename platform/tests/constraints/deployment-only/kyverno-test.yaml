apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: deployment-only
policies:
  - ../../.rendered/homelab-platform/templates/constraints/deployment-only.yaml
resources:
  - resources.yaml
results:
  # no-bare-pods: pods without ownerReferences are rejected in any tier namespace
  - kind: Pod
    policy: no-bare-pods
    resources:
      - pod-bare-in-app
    result: fail
  - kind: Pod
    policy: no-bare-pods
    resources:
      - pod-bare-in-tool
    result: fail
  # Pod with ownerReferences (created by a ReplicaSet) is allowed
  - kind: Pod
    policy: no-bare-pods
    resources:
      - pod-owned-in-app
    result: pass
  # Pod outside any tier namespace → matchCondition false → skip
  - kind: Pod
    policy: no-bare-pods
    resources:
      - pod-bare-outside
    result: skip

  # Mounting a claim by name is unconstrained here: the claim itself was gated at its own
  # admission, so any that exists in a governed namespace is already on a permitted class.
  - kind: Deployment
    policy: tier-claim-template-storage-class
    resources:
      - deploy-with-pvc-in-app
      - deploy-stateless-in-app
      - deploy-ephemeral-zerofs-in-app
      - deploy-with-pvc-in-tool
    result: pass
  - kind: Deployment
    policy: tier-claim-template-storage-class
    resources:
      - deploy-ephemeral-topolvm-in-app
      - deploy-ephemeral-unset-class-in-app
    result: fail
  # StatefulSets are a tool-* kind, and their volumeClaimTemplates take the same list
  - kind: StatefulSet
    policy: tier-claim-template-storage-class
    resources:
      - sts-zerofs-in-tool
    result: pass
  - kind: StatefulSet
    policy: tier-claim-template-storage-class
    resources:
      - sts-topolvm-in-tool
      - sts-unset-class-in-tool
    result: fail
  # CronJob pod specs nest one level deeper; the ephemeral check follows them there
  - kind: CronJob
    policy: tier-claim-template-storage-class
    resources:
      - cronjob-ephemeral-topolvm-in-tool
    result: fail
  # Ungoverned namespace → matchCondition false → skip
  - kind: Deployment
    policy: tier-claim-template-storage-class
    resources:
      - deploy-with-pvc-outside
    result: skip
