{{- if and .Values.operator.enabled .Values.operator.gitops.repoURL }}
{{- $g := .Values.operator.gitops }}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: operator
  namespace: {{ $g.argocdNamespace }}
  labels:
{{ include "platform.labels" . | indent 4 }}
spec:
  sourceRepos:
    - {{ $g.repoURL | quote }}
  destinations:
    - server: https://kubernetes.default.svc
      namespace: {{ include "platform.appGlob" . | quote }}
    - server: https://kubernetes.default.svc
      namespace: {{ include "platform.toolGlob" . | quote }}
    - server: https://kubernetes.default.svc
      namespace: {{ printf "!%s" .Values.operator.namespace | quote }}
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  # Every guardrail keyed to the operator judges a commit exactly as it judged a direct write.
  destinationServiceAccounts:
    - server: https://kubernetes.default.svc
      namespace: "*"
      defaultServiceAccount: {{ printf "%s:%s" .Values.operator.namespace (include "platform.argoServiceAccountName" .) | quote }}
---
# The operator chooses directories, never an Application's project or identity.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: operator
  namespace: {{ $g.argocdNamespace }}
  labels:
{{ include "platform.labels" . | indent 4 }}
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: {{ $g.repoURL | quote }}
        revision: main
        directories:
          - path: "*"
        requeueAfterSeconds: 30
  # Decommissioning a namespace stays a human act.
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: {{ `'{{ .path.basename }}'` }}
    spec:
      project: operator
      source:
        repoURL: {{ $g.repoURL | quote }}
        targetRevision: main
        path: {{ `'{{ .path.path }}'` }}
      destination:
        server: https://kubernetes.default.svc
        namespace: {{ `'{{ .path.basename }}'` }}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        # A new namespace's first sync is refused until governance has bound the operator into it.
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - ServerSideApply=true
---
# Read-only: a patch could rewrite an Application's project before the generator restores it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.operator.serviceAccountName }}-gitops-reader
  namespace: {{ $g.argocdNamespace }}
  labels:
{{ include "platform.labels" . | indent 4 }}
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications", "applicationsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.operator.serviceAccountName }}-gitops-reader
  namespace: {{ $g.argocdNamespace }}
  labels:
{{ include "platform.labels" . | indent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.operator.serviceAccountName }}-gitops-reader
subjects:
  - kind: ServiceAccount
    name: {{ .Values.operator.serviceAccountName }}
    namespace: {{ .Values.operator.namespace }}
---
# The server also impersonates the sync identity to show live resources and run UI actions, so the
# UI can do no more than a sync.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "platform.argoServiceAccountName" . }}-impersonator
  namespace: {{ .Values.operator.namespace }}
  labels:
{{ include "platform.labels" . | indent 4 }}
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["impersonate"]
    resourceNames: [{{ include "platform.argoServiceAccountName" . | quote }}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "platform.argoServiceAccountName" . }}-impersonator
  namespace: {{ .Values.operator.namespace }}
  labels:
{{ include "platform.labels" . | indent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "platform.argoServiceAccountName" . }}-impersonator
subjects:
  - kind: ServiceAccount
    name: {{ $g.serverServiceAccountName }}
    namespace: {{ $g.argocdNamespace }}
{{- end }}
