{{- $fullname := include "headlamp.fullname" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullname }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "headlamp.labels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "headlamp.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "headlamp.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "headlamp.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "headlamp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "headlamp.labels" . | nindent 8 }}
    spec:
      # The token only locates the API server: the account holds no role, and every request carries
      # the viewer's own.
      serviceAccountName: {{ $fullname }}
      enableServiceLinks: false
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: headlamp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["-in-cluster"]
          env:
            - name: HEADLAMP_CONFIG_OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientID | quote }}
            - name: HEADLAMP_CONFIG_OIDC_IDP_ISSUER_URL
              value: {{ .Values.oidc.issuerURL | quote }}
            - name: HEADLAMP_CONFIG_OIDC_SCOPES
              value: {{ .Values.oidc.scopes | join "," | quote }}
            - name: HEADLAMP_CONFIG_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oidc.secretName }}
                  key: clientSecret
          ports:
            - name: http
              containerPort: 4466
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
