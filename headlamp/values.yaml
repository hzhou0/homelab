# homelab-headlamp values

image:
  repository: ghcr.io/headlamp-k8s/headlamp
  tag: "v0.43.0"
  pullPolicy: IfNotPresent

oidc:
  issuerURL: https://auth.haustorium.net
  clientID: headlamp
  scopes: [profile, email, groups]
  # Created by hand before install, so nothing sensitive reaches the release history.
  secretName: headlamp-oidc

# The API server's, applied to every group the issuer asserts.
groupPrefix: "oidc:"
adminGroups: [admins]
readGroups: [infra-read]

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi
nodeSelector: {}
