apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: csi.zerofs.net
  labels:
    {{- include "zerofs.chartLabels" . | nindent 4 }}
spec:
  # A volume is a 9P mount the node plugin makes on demand; nothing is attached to a node, and
  # ownership lives on the gateway filesystem rather than being applied by kubelet.
  attachRequired: false
  podInfoOnMount: false
  fsGroupPolicy: None
  volumeLifecycleModes:
    - Persistent
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "zerofs.csi.controller.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zerofs.csi.labels" (dict "root" . "component" "controller") | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "zerofs.csi.node.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zerofs.csi.labels" (dict "root" . "component" "node") | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-csi-provisioner
  labels:
    {{- include "zerofs.csi.labels" (dict "root" . "component" "controller") | nindent 4 }}
rules:
  # `patch` is what HonorPVReclaimPolicy uses to manage its finalizer; without it PV deletion hangs.
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch", "create", "update", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["csinodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  # DeleteVolume is handed only a volume id and its secrets, so the admin endpoint has to be read
  # back from the StorageClass's provisioner secret.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-csi-provisioner
  labels:
    {{- include "zerofs.csi.labels" (dict "root" . "component" "controller") | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "zerofs.csi.controller.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ .Release.Name }}-csi-provisioner
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-csi-provisioner-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zerofs.csi.labels" (dict "root" . "component" "controller") | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "watch", "list", "delete", "update", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-csi-provisioner-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zerofs.csi.labels" (dict "root" . "component" "controller") | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "zerofs.csi.controller.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-csi-provisioner-leader-election
  apiGroup: rbac.authorization.k8s.io
