{{- if .Values.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zerofs.chartLabels" . | nindent 4 }}
spec:
  # Both halves, one job: a failover moves the serving numbers from one to the other, and the pair
  # only reads as a pair when the standby's silence sits next to the leader's traffic.
  selector:
    matchLabels:
      {{- include "zerofs.gateway.podSelectorLabels" . | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.monitoring.serviceMonitor.scrapeTimeout }}
{{- end }}
