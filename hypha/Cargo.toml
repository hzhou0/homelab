[workspace]
resolver = "2"
members = ["hypha-format", "hypha-core", "hypha"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/hzhou0/homelab"

[workspace.dependencies]
hypha-format = { path = "hypha-format" }
hypha-core = { path = "hypha-core" }

# Encryption
age = "0.11"
hmac = "0.12"          # trailer MAC (also an age dep — its own header MAC)
sha2 = "0.10"
subtle = "2"           # constant-time tag compare
bytemuck = { version = "1", features = ["derive"] }  # zero-copy facts struct

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "fs"] }
tokio-util = { version = "0.7", features = ["io", "io-util", "codec"] }

# S3 server surface + client
async-trait = "0.1"
md-5 = "0.10"
rand = "0.8"           # mpu stash nonces (§6); already in-tree via age
hex = "0.4"
percent-encoding = "2"  # decode encoding-type=url LIST keys (§6)
base64-simd = "0.8"     # Content-MD5 decode, stash nonces, twin facts; already in the tree via s3s
s3s = "0.14"
s3s-aws = "0.14"
aws-sdk-s3 = "1"
hyper = "1"
hyper-util = { version = "0.1", features = ["server", "server-auto", "server-graceful", "http1", "http2", "tokio"] }
# The §8 usage source, which is HTTP+JSON rather than S3. No TLS feature: the endpoints it reads are
# the cache backend's own admin surface, in-cluster and plain HTTP, so pulling a second TLS stack in
# beside the SDK's would buy nothing.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde_json = "1"

# Config / errors / observability
serde = { version = "1", features = ["derive"] }
figment = { version = "0.10", features = ["toml", "env"] }
thiserror = "1"      # derive Display/Error/From on the layered error enums
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Testing
proptest = "1"
criterion = "0.5"
tempfile = "3"
futures = "0.3"
arc-swap = "1.9"
dashmap = "6"
# `rand` off: it only picks the hasher's seed, and the §8 ring pins its own so a slice sealed by one
# process still means something to the next. Drops the `rand` tree; foldhash covers what remains.
fastbloom = { version = "0.17", default-features = false, features = ["std"] }
