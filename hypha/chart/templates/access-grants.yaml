{{- /*
Ingress allows layered on the cluster-wide east-west default deny.

The S3 port is open to the whole cluster: it is SigV4-authenticated and already reachable from the
LAN through the gateway, so a source fence in front of it restricts nothing an attacker has to pass.
The admin listener is unauthenticated, so it keeps a real fence.

The gateway's own reverse hop is NOT granted here: it is an allow-list held by the cilium chart
(gateway.backendNamespaces), so a route into this namespace stays dead until it is listed there.
*/ -}}
{{- range $name, $deployment := .Values.deployments }}
{{- $ctx := dict "root" $ "deployment" $name }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-{{ include "hypha.fullname" $ctx }}-s3
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "hypha.labels" $ctx | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "hypha.selectorLabels" $ctx | nindent 6 }}
  ingress:
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: {{ $.Values.serving.port | quote }}
              protocol: TCP
{{- if $.Values.monitoring.namespace }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-{{ include "hypha.fullname" $ctx }}-admin
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "hypha.labels" $ctx | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "hypha.selectorLabels" $ctx | nindent 6 }}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ $.Values.monitoring.namespace }}
      toPorts:
        - ports:
            - port: {{ $.Values.serving.adminPort | quote }}
              protocol: TCP
{{- end }}
{{- end }}
