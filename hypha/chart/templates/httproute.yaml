{{- if .Values.gateway.enabled }}
{{- range $name, $deployment := .Values.deployments }}
{{- $ctx := dict "root" $ "deployment" $name }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "hypha.fullname" $ctx }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "hypha.labels" $ctx | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $.Values.gateway.name }}
      namespace: {{ $.Values.gateway.namespace }}
  hostnames:
    - {{ required (printf "deployments.%s.hostname is required" $name) $deployment.hostname | quote }}
  rules:
    - timeouts:
        request: {{ $.Values.gateway.requestTimeout | quote }}
      backendRefs:
        - name: {{ include "hypha.fullname" $ctx }}
          port: {{ $.Values.serving.port }}
{{- end }}
{{- end }}
