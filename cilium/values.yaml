# homelab-cilium values

# Upstream Cilium subchart values. Nothing installs Cilium outside this chart, so this is the
# authoritative source for the CNI's configuration.
cilium:
  enabled: true

  cluster:
    name: default
  ipv6:
    enabled: true
  ipam:
    operator:
      clusterPoolIPv4PodCIDRList: 10.42.0.0/16
      # Must match the v6 half of k3s's --cluster-cidr.
      clusterPoolIPv6PodCIDRList: [ fd52:ff39:512b:4200::/56 ]
      clusterPoolIPv6MaskSize: 64
  # k3s's kubeconfig carries 127.0.0.1; agent nodes need the routable address to reach the API
  # server under kube-proxy replacement.
  k8sServiceHost: 10.0.0.22
  k8sServicePort: 6443
  kubeProxyReplacement: true
  operator:
    replicas: 1
    # Keep cilium-operator off reclaimable capacity. The agent DaemonSet is the CNI and must stay on
    # every node, spot included, so it is deliberately not constrained.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node.kubernetes.io/capacity-type
                  operator: NotIn
                  values: [spot]
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                io.cilium/app: operator
  routingMode: tunnel
  tunnelProtocol: vxlan

  gatewayAPI:
    enabled: true

  hubble:
    enabled: true
    relay:
      enabled: true
    ui:
      enabled: true

  # Scope Cilium's datapath (and host firewall) to ethernet only: a node that rolls onto wifi would
  # otherwise have Cilium manage that interface and the host firewall would lock down wifi ingress.
  devices: "eth+"

  # Compatible with tunnel/vxlan: host policy does NOT affect pod-to-pod traffic.
  hostFirewall:
    enabled: true

  l2announcements:
    enabled: true
  # Raise client rate limits per Cilium's L2 guidance to avoid throttling with per-service Leases.
  k8sClientRateLimit:
    qps: 50
    burst: 100

# East-west default-deny (the authoritative ingress fence).
eastWestDefaultDeny:
  enabled: true
  # MUST match the platform chart's networkPolicy.excludeNamespaces — one exclude-set split across
  # two charts.
  excludeNamespaces:
    - kube-system
    - kube-public
    - kube-node-lease
    - default
    - cilium-gateway
    - cilium-secrets
    - cert-manager
    - kyverno

# ---------------------------------------------------------------------------
# Host firewall
# ---------------------------------------------------------------------------
hostFirewall:
  enabled: true
  adminCIDRs:
    - 10.0.0.232/32
    - 10.0.1.140/32

# ---------------------------------------------------------------------------
# LoadBalancer IP management (Cilium LB IPAM + L2)
# ---------------------------------------------------------------------------
loadBalancer:
  enabled: true
  pool:
    name: v4
    start: "10.0.0.101"
    stop: "10.0.0.150"
  # Starts above the gateway slice at the bottom of the prefix, which is pinned per Gateway.
  v6Pool:
    name: v6
    start: "2001:569:5bc1:7f00:ffff::100"
    stop: "2001:569:5bc1:7f00:ffff::ffff"
  l2:
    name: lab-l2
    # Pin the announcer to the control-plane node: it must already be up for the cluster to function,
    # so hosting the LB IPs there means ephemeral worker failover never disturbs LB reachability.
    nodeSelector:
      matchLabels:
        kubernetes.io/hostname: k3s-server
    interfaces: []

# ---------------------------------------------------------------------------
# Ingress Gateways
# ---------------------------------------------------------------------------
# One entry per Gateway, every entry the same shape. Each admits routes only from its own namespace,
# so its route list is the whole of what it serves and publishing anything is an edit here.
ingressLabel: homelab.lab/ingress

# The authorization service a route's filter asks before proxying. Every gateway namespace is
# granted a reference to it; a route opts out per entry.
externalAuth:
  enabled: true
  namespace: identity
  service: identity-authelia
  port: 9091

gateways:
  internal:
    enabled: true
    namespace: cilium-gateway
    className: cilium
    hostname: "*.internal.haustorium.net"
    listenPort: 443
    # A plaintext listener beside the TLS one. Empty serves HTTPS only.
    plaintextPort: 80
    tls:
      secretName: internal-haustorium-wildcard-tls
      issuerName: letsencrypt-cloudflare
    # The Gateway Service has no endpoints (Envoy is fronted by Cilium's BPF), so it needs its own
    # single-IP pool rather than a slice of the general one.
    address:
      poolName: gateway-pool
      ip: "10.0.0.100"
      v6: ""
    # Turned into overrides on the LAN resolver. A wildcard answers for every route below at once.
    dnsNames: ["*.internal.haustorium.net"]
    # No WAN forward: this address answers on the LAN only.
    expose: false
    # Ports forwarded byte-for-byte to one namespace each, for protocols the HTTP listeners cannot
    # carry. The hostname wildcard already answers for them at any depth, so they need no record.
    tcpListeners:
      - name: postgres
        port: 5432
        namespace: neon
    routes:
      home.internal.haustorium.net:
        /:
          namespace: app-homepage
          name: homepage
          port: 80
      memos.internal.haustorium.net:
        /:
          namespace: app-memos
          name: memos
          port: 80
      navidrome.internal.haustorium.net:
        /:
          namespace: app-navidrome
          name: navidrome
          port: 80
      music-files.internal.haustorium.net:
        /:
          namespace: app-navidrome
          name: filebrowser
          port: 80
      s3.internal.haustorium.net:
        /:
          namespace: hypha
          name: hypha-cached
          port: 8014
          externalAuth: false
          # S3 bodies are unbounded, so any request timeout is a size limit in disguise.
          requestTimeout: 0s
      s3-direct.internal.haustorium.net:
        /:
          namespace: hypha
          name: hypha-durable
          port: 8014
          externalAuth: false
          # S3 bodies are unbounded, so any request timeout is a size limit in disguise.
          requestTimeout: 0s
      auth.internal.haustorium.net:
        /:
          namespace: identity
          name: identity-authelia
          port: 9091
          externalAuth: false
      users.internal.haustorium.net:
        /:
          namespace: identity
          name: identity-lldap
          port: 17170
      hubble.internal.haustorium.net:
        /:
          namespace: kube-system
          name: hubble-ui
          port: 80
      kyverno.internal.haustorium.net:
        /:
          namespace: kyverno
          name: policy-reporter-ui
          port: 8080
      grafana.internal.haustorium.net:
        /:
          namespace: monitoring
          name: homelab-monitoring-grafana
          port: 80
      prometheus.internal.haustorium.net:
        /:
          namespace: monitoring
          name: homelab-monitoring-kube-pr-prometheus
          port: 9090
      seaweedfs.internal.haustorium.net:
        /:
          namespace: seaweedfs
          name: homelab-seaweedfs-master
          port: 9333
      seaweedfs-filer.internal.haustorium.net:
        /:
          namespace: seaweedfs
          name: homelab-seaweedfs-filer
          port: 8888
      files.internal.haustorium.net:
        # Its session endpoint is served by a helper that supplies the identity the application has
        # no way to read for itself.
        /api/session/auth/:
          namespace: tool-filestash
          name: filestash
          port: 8080
        /:
          namespace: tool-filestash
          name: filestash
          port: 80
      headlamp.internal.haustorium.net:
        /:
          namespace: tool-headlamp
          name: headlamp
          port: 80

  # The authorization service a published route sends its subrequest to. Every namespace that may
  # hold a route is granted a reference to it.
  public:
    enabled: true
    namespace: cilium-gateway-public
    className: cilium
    hostname: "*.haustorium.net"
    listenPort: 443
    plaintextPort: ""
    tls:
      secretName: haustorium-wildcard-tls
      issuerName: letsencrypt-cloudflare
    address:
      poolName: public-gateway-pool
      ip: "10.0.0.99"
      v6: "2001:569:5bc1:7f00:ffff::1"
    # Never a wildcard: it would shadow every name in the public zone, including those that resolve
    # outside the cluster.
    dnsNames: []
    expose: true
    tcpListeners: []
    routes: {}

# ---------------------------------------------------------------------------
# WireGuard remote-access tunnel
# ---------------------------------------------------------------------------
# A cluster-hosted WireGuard server so admins can tunnel in from off-LAN. Decrypted client traffic
# is masqueraded to the pod IP, so Cilium sees the whole tunnel as a single endpoint to fence.
wireguard:
  enabled: true
  namespace: wireguard
  image: lscr.io/linuxserver/wireguard:1.0.20260223
  # One-shot privileged init that enables net.ipv4.ip_forward in the pod netns.
  sysctlInitImage: busybox:1.37
  listenPort: 51820
  # Pinned so the OPNsense WAN forward has a stable target. Keep out of any other Service's use.
  loadBalancerIP: "10.0.0.101"
  # Must be the L2 announcer host: that node alone answers loadBalancerIP, and
  # externalTrafficPolicy:Local will not forward off-node.
  nodeName: k3s-server
  # Off => wire the WAN UDP forward by hand instead of letting opnsense-operator reconcile it.
  expose: true
  # Peer subnet; the server interface takes .1.
  serverAddress: "10.9.0.1/24"
  # LAN resolver (OPNsense Unbound) the tunnel may reach — it answers the internal wildcard.
  lanDNS: "10.0.0.1"

  # Opens the egress fence to the k3s API server for admin kubectl over the tunnel. Enabling it
  # here is not enough — the peer must also route the API server in its client AllowedIPs.
  apiServer:
    enabled: true
    # Client-side routing only. The server-side policy matches the kube-apiserver entity, so this
    # CIDR is not consulted there.
    address: "10.0.0.22/32"
    port: 6443

  # Injected at runtime from a Secret you precreate, so it never enters Helm release state. The
  # chart owns the namespace, so create the Secret after the first upgrade (Helm can't adopt one).
  privateKeySecret:
    name: wireguard-privatekey
    key: privatekey

  # Not secret: public keys and tunnel addresses only.
  peers:
    - name: laptop
      publicKey: "IfvIa2dLZYVQ+DP/WMYW5Xg2BiVvhvdKLSR1WKk2Y1c="
      address: "10.9.0.2/32"
