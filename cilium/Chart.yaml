apiVersion: v2
name: homelab-cilium
description: >-
  Cilium for the homelab k3s cluster: the CNI, the service mesh (Gateway API + L7/Envoy),
  LB IPAM with L2/NDP announcements, and a single ingress Gateway for *.internal.haustorium.net.
  Foundational networking installed by a human (cluster-admin) into kube-system, not by the
  autonomous operator.
type: application
version: 0.2.0
appVersion: "1.20.0"
keywords:
  - cilium
  - cni
  - service-mesh
  - gateway-api
  - homelab
dependencies:
  # Floor for IPv6 LB announcement: earlier releases never join the solicited-node multicast
  # group for LB addresses, so NDP for the v6 pool goes unanswered (cilium#44311).
  - name: cilium
    version: "1.20.0"
    repository: https://helm.cilium.io
    condition: cilium.enabled
