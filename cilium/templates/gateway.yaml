{{- if .Values.gateway.enabled }}
{{- $g := .Values.gateway }}
# The ingress label is what the generated per-namespace NetworkPolicies match to admit this gateway.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $g.namespace }}
  labels:
    {{ $g.ingressLabel | default "homelab.lab/ingress" }}: "true"
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: homelab-cilium
---
# Until the ACME order completes the Gateway stays un-programmed for HTTPS — expected on first install.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $g.name }}-tls
  namespace: {{ $g.namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: homelab-cilium
spec:
  secretName: {{ $g.tlsSecretName }}
  dnsNames:
    - {{ $g.hostname | quote }}
  issuerRef:
    name: {{ $g.issuerName }}
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $g.name }}
  namespace: {{ $g.namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: homelab-cilium
  annotations:
    homelab.lab/hostname: {{ $g.hostname | quote }}
    {{- if $g.expose }}
    homelab.lab/expose: "true"
    {{- end }}
spec:
  gatewayClassName: {{ $g.gatewayClassName | default "cilium" }}
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: {{ $g.hostname | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ $g.tlsSecretName }}
      allowedRoutes:
        namespaces:
          from: All
    - name: http
      protocol: HTTP
      port: 80
      hostname: {{ $g.hostname | quote }}
      allowedRoutes:
        namespaces:
          from: All
    {{- range $g.tcpListeners }}
    # Raw TCP: a protocol whose own TLS is not a ClientHello on the first byte cannot be routed by
    # SNI. This bypasses Envoy entirely and is forwarded to the backend Service, so neither the L3
    # allow-list above nor the backend grant applies — the backend admits its own clients.
    - name: {{ .name }}
      protocol: TCP
      port: {{ .port }}
      allowedRoutes:
        # No `kinds` here: naming one makes every route that does not name a sectionName get tested
        # against this listener, and the HTTP routes on this gateway do not name one.
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace }}
    {{- end }}
{{- end }}
