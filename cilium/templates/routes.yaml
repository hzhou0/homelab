{{- range $name, $g := .Values.gateways }}
{{- if $g.enabled }}
{{- $named := dict }}
{{- range $host, $paths := $g.routes }}
{{- $route := first (splitList "." $host) }}
{{- with index $named $route }}{{ fail (printf "gateway %s: %s and %s both reduce to route %s" $name . $host $route) }}{{ end }}
{{- $_ := set $named $route $host }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $route }}
  namespace: {{ $g.namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    app.kubernetes.io/part-of: homelab-cilium
spec:
  parentRefs:
    - name: {{ $name }}
      namespace: {{ $g.namespace }}
  hostnames:
    - {{ $host | quote }}
  rules:
{{- range $prefix, $path := $paths }}
    - {{- with $path.requestTimeout }}
      timeouts:
        request: {{ . | quote }}
      {{- end }}
      matches:
        # Exact is how a bare host is published without the prefix dragging in every other path the
        # backend serves on the same port.
        - path:
            type: {{ $path.match | default "PathPrefix" }}
            value: {{ $prefix | quote }}
      backendRefs:
        - name: {{ $path.name }}
          namespace: {{ $path.namespace }}
          port: {{ $path.port }}
      {{- if and $.Values.externalAuth.enabled (ne $path.externalAuth false) }}
      filters:
        {{- include "cilium.externalAuth" (dict "root" $ "forwardAuthorization" $path.forwardAuthorization) | nindent 8 }}
        {{- if ne $path.forwardAuthorization true }}
        # A credential here is the authorizer's. Header mutations run after the filter chain, so it
        # is read there and gone before the backend sees the request.
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - Authorization
        {{- end }}
      {{- end }}
{{- end }}
{{- end }}
{{- $grants := dict }}
{{- range $host, $paths := $g.routes }}
{{- range $prefix, $path := $paths }}
{{- if ne $path.namespace $g.namespace }}
{{- $_ := set $grants $path.namespace (append (index $grants $path.namespace | default list) $path.name) }}
{{- end }}
{{- end }}
{{- end }}
{{- range $ns, $names := $grants }}
---
# The backend namespace, not the route, is what consents to being published.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: {{ $name }}-gateway
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    app.kubernetes.io/part-of: homelab-cilium
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: {{ $g.namespace }}
  to:
    {{- range $n := ($names | uniq | sortAlpha) }}
    - group: ""
      kind: Service
      name: {{ $n | quote }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
