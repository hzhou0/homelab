{{- $enabled := dict }}
{{- range $name, $g := .Values.gateways }}
{{- if $g.enabled }}
{{- $_ := set $enabled $name $g }}
{{- end }}
{{- end }}
{{- if $enabled }}
# Nothing restricts who may reach a Gateway's front door. One `ingress` identity fronts them all, so
# a source rule could never mean "this Gateway" — and the only thing that can tell them apart by
# address is the router in front, for the traffic it routes. Each route authenticates instead.
{{- with (splitList "," (include "cilium.gatewayBackends" .) | compact) }}
---
# Reverse hop: Envoy re-identifies proxied traffic as `reserved:ingress`, which a namespaceSelector
# cannot match — so this hop needs a Cilium-native allow too. Additive; the east-west fence owns the
# deny. Derived from the routes, so a namespace is reachable exactly as long as something serves it.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-gateway-ingress-to-backends
  labels:
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    app.kubernetes.io/part-of: homelab-cilium
spec:
  endpointSelector:
    matchExpressions:
      - key: k8s:io.kubernetes.pod.namespace
        operator: In
        values:
{{- range $ns := . }}
          - {{ $ns | quote }}
{{- end }}
  enableDefaultDeny:
    ingress: false
  ingress:
    - fromEntities:
        - ingress
{{- end }}
{{- end }}
