{{- if .Values.gateway.enabled }}
# Clients → `ingress` proxy L3 allow-list. A vanilla k8s NetworkPolicy cannot match the reserved
# `ingress` identity, so this front-door allow is Cilium-native.
#
# `ingress` is deliberately NOT granted cluster-wide, so a route into a fenced namespace stays dead
# until that namespace is listed as a backend.
{{- if .Values.gateway.allowedCIDRs }}
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-clients-to-gateway-ingress
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: homelab-cilium
spec:
  endpointSelector:
    matchLabels:
      reserved:ingress: ""
  ingress:
    - fromCIDR:
        {{- range .Values.gateway.allowedCIDRs }}
        - {{ . | quote }}
        {{- end }}
{{- else }}
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-clients-to-gateway-ingress
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: homelab-cilium
spec:
  endpointSelector:
    matchLabels:
      reserved:ingress: ""
  ingress:
    - fromEntities:
        - world
        - cluster
{{- end }}
{{- if .Values.gateway.backendNamespaces }}
---
# Reverse hop: Envoy re-identifies proxied traffic as `reserved:ingress`, which a namespaceSelector
# cannot match — so this hop needs a Cilium-native allow too. Additive; the east-west fence owns the deny.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-gateway-ingress-to-backends
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: homelab-cilium
spec:
  endpointSelector:
    matchExpressions:
      - key: k8s:io.kubernetes.pod.namespace
        operator: In
        values:
{{- range $ns := .Values.gateway.backendNamespaces }}
          - {{ $ns | quote }}
{{- end }}
  enableDefaultDeny:
    ingress: false
  ingress:
    - fromEntities:
        - ingress
{{- end }}
{{- end }}
