{{- if .Values.loadBalancer.enabled }}
{{- $lb := .Values.loadBalancer }}
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: {{ $lb.pool.name }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: homelab-cilium
spec:
  blocks:
    - start: {{ $lb.pool.start | quote }}
      stop: {{ $lb.pool.stop | quote }}
  serviceSelector:
    matchExpressions:
      - key: io.cilium.gateway/owning-gateway
        operator: DoesNotExist
{{- range $name, $g := $.Values.gateways }}
{{- if $g.enabled }}
---
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: {{ $g.address.poolName }}
  labels:
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    app.kubernetes.io/part-of: homelab-cilium
spec:
  # start==stop single-IP range instead of a /32 cidr (allowFirstLastIPs can't drop it).
  blocks:
    - start: {{ $g.address.ip | quote }}
      stop: {{ $g.address.ip | quote }}
    {{- with $g.address.v6 }}
    - start: {{ . | quote }}
      stop: {{ . | quote }}
    {{- end }}
  serviceSelector:
    matchLabels:
      io.cilium.gateway/owning-gateway: {{ $name | quote }}
{{- end }}
{{- end }}
{{- if $lb.v6Pool.start }}
---
# Global unicast with no NAT in front of it: an address handed out here is internet-routable the
# moment it is assigned, gated only by the OPNsense WAN firewall.
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: {{ $lb.v6Pool.name }}
  labels:
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    app.kubernetes.io/part-of: homelab-cilium
spec:
  blocks:
    - start: {{ $lb.v6Pool.start | quote }}
      stop: {{ $lb.v6Pool.stop | quote }}
  serviceSelector:
    matchExpressions:
      - key: io.cilium.gateway/owning-gateway
        operator: DoesNotExist
{{- end }}
---
# Selects services, not pools — one unselective policy announces every LB IP of both families,
# ARP for v4 and NDP for v6.
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: {{ $lb.l2.name }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: homelab-cilium
spec:
  loadBalancerIPs: true
  {{- with $lb.l2.interfaces }}
  interfaces:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  nodeSelector:
    {{- toYaml $lb.l2.nodeSelector | nindent 4 }}
{{- end }}
