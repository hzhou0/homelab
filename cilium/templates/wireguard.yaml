{{- if .Values.wireguard.enabled }}
{{- $wg := .Values.wireguard }}
apiVersion: v1
kind: Namespace
metadata:
  # A foundational (non-tier) namespace so Kyverno pod governance does not apply — the WireGuard
  # container needs NET_ADMIN. It is deliberately left east-west fenced anyway.
  name: {{ $wg.namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: homelab-cilium
---
apiVersion: v1
kind: ConfigMap
metadata:
  # No secret material: peer public keys are not sensitive, and the server private key is injected
  # at runtime so it never lands in Helm state.
  name: wireguard-config
  namespace: {{ $wg.namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: homelab-cilium
data:
  wg0.conf: |
    [Interface]
    Address = {{ $wg.serverAddress }}
    ListenPort = {{ $wg.listenPort }}
    # wg-quick brings the interface up keyless, then `wg set` loads the key from the mounted Secret.
    # Masquerade pins decrypted peer traffic to the pod IP so Cilium sees one endpoint, not many.
    PostUp = wg set %i private-key /run/wireguard-keys/{{ $wg.privateKeySecret.key }}; iptables -A FORWARD -i %i -j ACCEPT; iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
    PostDown = iptables -D FORWARD -i %i -j ACCEPT; iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE
    {{- range $wg.peers }}

    [Peer]
    # {{ .name }}
    PublicKey = {{ .publicKey }}
    AllowedIPs = {{ .address }}
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wireguard
  namespace: {{ $wg.namespace }}
  labels:
    app.kubernetes.io/name: wireguard
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: homelab-cilium
spec:
  # WireGuard peer state is a single UDP socket; a second replica would answer handshakes
  # inconsistently behind one VIP.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wireguard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wireguard
    spec:
      # Co-locate with the L2 announcer: only that node answers the LB IP, and
      # externalTrafficPolicy:Local won't forward off-node, so the pod must live there.
      nodeSelector:
        kubernetes.io/hostname: {{ $wg.nodeName }}
      initContainers:
        # Enable IP forwarding in the pod netns (the main container relays wg0<->eth0). Confined to
        # this one-shot: the runtime mounts /proc/sys read-only, so writing net.ipv4.ip_forward needs
        # an unmasked /proc (privileged); the sysctl persists in the shared netns for the main
        # container, which then stays at NET_ADMIN.
        - name: enable-forwarding
          image: {{ $wg.sysctlInitImage | quote }}
          command: ["sysctl", "-w", "net.ipv4.ip_forward=1"]
          securityContext:
            privileged: true
      containers:
        - name: wireguard
          image: {{ $wg.image | quote }}
          securityContext:
            capabilities:
              # No kernel module mount: linuxserver/wireguard falls back to userspace wireguard-go
              # when the module is unavailable, so NET_ADMIN + /dev/net/tun is enough.
              add:
                - NET_ADMIN
          ports:
            - name: wireguard
              containerPort: {{ $wg.listenPort }}
              protocol: UDP
          volumeMounts:
            - name: config
              mountPath: /config/wg_confs
              readOnly: true
            - name: privatekey
              # NOT /etc/wireguard — in this image that path symlinks into the read-only conf mount.
              mountPath: /run/wireguard-keys
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: wireguard-config
        - name: privatekey
          secret:
            secretName: {{ $wg.privateKeySecret.name }}
---
apiVersion: v1
kind: Service
metadata:
  name: wireguard
  namespace: {{ $wg.namespace }}
  labels:
    app.kubernetes.io/name: wireguard
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: homelab-cilium
  annotations:
    lbipam.cilium.io/ips: {{ $wg.loadBalancerIP | quote }}
    {{- if $wg.expose }}
    # No homelab.lab/hostname: its Unbound record resolves to the internal LB IP, which is useless
    # to an off-LAN peer dialing the WAN.
    homelab.lab/expose: "true"
    homelab.lab/protocol: "udp"
    homelab.lab/external-port: {{ $wg.listenPort | quote }}
    homelab.lab/internal-port: {{ $wg.listenPort | quote }}
    {{- end }}
spec:
  type: LoadBalancer
  # Preserve the external client IP (harmless here, but keeps peer endpoints stable for logging).
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: wireguard
  ports:
    - name: wireguard
      protocol: UDP
      port: {{ $wg.listenPort }}
      targetPort: {{ $wg.listenPort }}
---
# The namespace is fenced east-west, so the inbound handshake needs an additive re-open from world.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-world-to-wireguard
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: homelab-cilium
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: {{ $wg.namespace }}
      app.kubernetes.io/name: wireguard
  enableDefaultDeny:
    ingress: false
  ingress:
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: {{ $wg.listenPort | quote }}
              protocol: UDP
---
# The gateway is an L7 LoadBalancer (Cilium Envoy): for an L7LB service Cilium enforces THIS pod's
# egress against the backend Envoy ultimately routes to, NOT the reserved:ingress proxy — so a
# toEntities:ingress rule is a no-op and the allow-list must name the backends directly.
# Peer->server replies return statefully via conntrack, so no world egress is needed as long as
# peers use PersistentKeepalive.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: wireguard-egress-fence
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: homelab-cilium
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: {{ $wg.namespace }}
      app.kubernetes.io/name: wireguard
  enableDefaultDeny:
    egress: true
    ingress: false
  egress:
    {{- if .Values.gateway.backendNamespaces }}
    - toEndpoints:
        {{- range $ns := .Values.gateway.backendNamespaces }}
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ $ns | quote }}
        {{- end }}
    {{- end }}
    {{- if .Values.gateway.hubbleUI.enabled }}
    # Scope to the hubble-ui pods, not all of kube-system.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: hubble-ui
    {{- end }}
    - toCIDR:
        - {{ printf "%s/32" $wg.lanDNS | quote }}
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    {{- if $wg.apiServer.enabled }}
    # The kube-apiserver entity matches the host-network apiserver; a toCIDR to the node IP would
    # land on the host/remote-node identity and miss.
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: {{ $wg.apiServer.port | quote }}
              protocol: TCP
    {{- end }}
---
# The gateway front door, granted by identity rather than source CIDR: masquerade hides the peer
# CIDR, so a fromCIDR match would never fire.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-wireguard-to-gateway-ingress
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: homelab-cilium
spec:
  endpointSelector:
    matchLabels:
      reserved:ingress: ""
  enableDefaultDeny:
    ingress: false
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ $wg.namespace }}
            app.kubernetes.io/name: wireguard
{{- end }}