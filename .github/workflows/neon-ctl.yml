name: neon-ctl image

# Tests neon-ctl and pushes its image to GHCR. Scoped to its subtree in this monorepo: a
# chart-only change deploys a different tag, it does not produce one.
on:
  push:
    branches: [main]
    paths:
      - "neon/ctl/**"
      - ".github/workflows/neon-ctl.yml"
  pull_request:
    paths:
      - "neon/ctl/**"
      - ".github/workflows/neon-ctl.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/neon-ctl

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neon/ctl
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: neon/ctl/go.mod
          cache-dependency-path: neon/ctl/go.sum

      # `make fmt` rewrites rather than reports, so it can never fail a build.
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: make vet

      # Fetches an apiserver and etcd first: the kube package tests run against a real one.
      - name: Test
        run: make test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # No credentials on a fork, and only main should produce an image.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # The commit is the only tag. Nothing moves, so the tag a chart pins is a statement
          # about one build rather than about whatever was pushed last.
          tags: type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: neon/ctl
          file: neon/ctl/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=neon-ctl
          cache-to: type=gha,mode=max,scope=neon-ctl
