# Stands in for hypha. Whether hypha itself serves Neon's S3 usage is a question only the real
# cluster answers; what this has to prove is that the chart's wiring is right.
apiVersion: v1
kind: Namespace
metadata:
  name: minio
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-10-13T13-34-11Z
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              value: neon
            - name: MINIO_ROOT_PASSWORD
              value: neonneon
          ports:
            - name: s3
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: minio
spec:
  selector:
    app: minio
  ports:
    - name: s3
      port: 9000
      targetPort: s3
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bucket
  namespace: minio
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        # Neither Neon component creates a bucket lazily, and neither does hypha.
        - name: create
          image: minio/mc:RELEASE.2024-10-08T09-37-26Z
          command:
            - /bin/sh
            - -ec
            - |
              until mc alias set local http://minio:9000 neon neonneon; do sleep 3; done
              mc mb --ignore-existing local/neon
