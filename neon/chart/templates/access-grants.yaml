{{- /*
Who may reach the proxy. Same-namespace traffic and the metrics scrape are already admitted by the
generated per-namespace policy; everything else is named here.

A TCP listener bypasses the gateway's Envoy and is forwarded straight to these pods, so a client
arriving that way is the world entity and none of the gateway's own admissions apply to it.
*/ -}}
{{- if $.Values.proxy.allowFrom }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "neon.fullname" (dict "root" $ "component" "proxy-clients") }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "neon.chartLabels" $ | nindent 4 }}
spec:
  # Purely additive: the cluster-wide policy already denies, and selecting an endpoint here must not
  # narrow anything the storage mesh depends on.
  enableDefaultDeny:
    ingress: false
  endpointSelector:
    matchLabels:
      {{- include "neon.selectorLabels" (dict "root" $ "component" "proxy") | nindent 6 }}
  ingress:
    - {{ if eq (toString $.Values.proxy.allowFrom) "world" }}fromEntities: [world]
      {{- else }}fromCIDR:
        {{- toYaml $.Values.proxy.allowFrom | nindent 8 }}
      {{- end }}
      toPorts:
        - ports:
            - port: {{ $.Values.proxy.pgPort | quote }}
              protocol: TCP
{{- end }}
{{- range $namespace := $.Values.accessGrants }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "neon.fullname" (dict "root" $ "component" (printf "allow-%s" $namespace)) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "neon.chartLabels" $ | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "neon.selectorLabels" (dict "root" $ "component" "proxy") | nindent 6 }}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ $namespace }}
      toPorts:
        - ports:
            - port: {{ $.Values.proxy.pgPort | quote }}
              protocol: TCP
{{- end }}
