{{- range $sk := .Values.safekeepers }}
{{- $ctx := dict "root" $ "component" (printf "safekeeper-%v" $sk.id) }}
{{- $fullname := include "neon.safekeeperName" (dict "root" $ "id" $sk.id) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}
  namespace: {{ $.Release.Namespace }}
  # neon-ctl registers safekeepers with the storage controller by reading these Services, so this
  # object is the whole record: the id it is keyed by, and the zone it is spread across.
  labels:
    {{- include "neon.labels" $ctx | nindent 4 }}
    neon.internal/safekeeper-id: {{ $sk.id | quote }}
    neon.internal/availability-zone: {{ $sk.availabilityZone | default $fullname | quote }}
spec:
  selector:
    {{- include "neon.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: pg
      port: {{ $.Values.safekeeper.pgPort }}
      targetPort: pg
    - name: http
      port: {{ $.Values.safekeeper.httpPort }}
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "neon.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ $fullname }}
  selector:
    matchLabels:
      {{- include "neon.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "neon.selectorLabels" $ctx | nindent 8 }}
        {{- with $.Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $.Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      enableServiceLinks: false
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $sk.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "neon.authInit" (dict "root" $ "scopes" "safekeeperdata") | nindent 8 }}
      containers:
        - name: safekeeper
          image: {{ include "neon.image" $ }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command:
            - /usr/local/bin/safekeeper
          args:
            - --id={{ $sk.id }}
            - --datadir=/data
            - --listen-pg=0.0.0.0:{{ $.Values.safekeeper.pgPort }}
            - --listen-http=0.0.0.0:{{ $.Values.safekeeper.httpPort }}
            # What a compute is told to connect to. Without it the advertised address is the bind
            # address, which is 0.0.0.0 and reaches nothing.
            - --advertise-pg={{ $fullname }}.{{ $.Release.Namespace }}.svc.cluster.local:{{ $.Values.safekeeper.pgPort }}
            - --broker-endpoint={{ include "neon.brokerEndpoint" $ }}
            - --pg-auth-public-key-path={{ include "neon.authPublicKeyPath" (dict "root" $) }}
            - --http-auth-public-key-path={{ include "neon.authPublicKeyPath" (dict "root" $) }}
            # Presented to another safekeeper rather than validated: recovering a timeline from a
            # peer reads that peer's HTTP API, which demands a token of its own.
            - --auth-token-path={{ include "neon.authDir" (dict "root" $) }}/safekeeperdata.jwt
            # The retention horizon includes backup_lsn, which advances only when the offload task
            # has somewhere to write. Without this no segment is reclaimed and the volume fills.
            - --remote-storage={{ include "neon.remoteStorage" (dict "root" $ "prefix" $.Values.bucket.safekeeperPrefix) }}
          env:
            {{- include "neon.bucketEnv" $ | nindent 12 }}
          ports:
            - name: pg
              containerPort: {{ $.Values.safekeeper.pgPort }}
              protocol: TCP
            - name: http
              containerPort: {{ $.Values.safekeeper.httpPort }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /v1/status
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
            {{- include "neon.authVolumeMount" (dict "root" $) | nindent 12 }}
          resources:
            {{- toYaml $.Values.safekeeper.resources | nindent 12 }}
      volumes:
        {{- include "neon.authVolume" (dict "root" $) | nindent 8 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ $.Values.safekeeper.storageClass }}
        resources:
          requests:
            storage: {{ $.Values.safekeeper.size }}
{{- end }}
