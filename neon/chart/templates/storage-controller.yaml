{{- $ctx := dict "root" $ "component" "storage-controller" }}
{{- $fullname := include "neon.fullname" $ctx }}
{{- $db := include "neon.fullname" (dict "root" $ "component" "controller-db") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "neon.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  # It owns generation numbers, and two of it issuing them concurrently is the corruption the
  # numbers exist to prevent.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "neon.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "neon.selectorLabels" $ctx | nindent 8 }}
        {{- with $.Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $.Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      enableServiceLinks: false
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.storageController.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "neon.authInit" (dict "root" $ "scopes" "admin,pageserverapi,safekeeperdata") | nindent 8 }}
      containers:
        - name: storage-controller
          image: {{ include "neon.image" $ }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          # Alone among the components it takes the key and the tokens as values rather than paths,
          # so what the init container derived is read back here instead of being mounted.
          command:
            - /bin/sh
            - -ec
            - |
              export PUBLIC_KEY="$(cat {{ include "neon.authDir" (dict "root" $) }}/public.pem)"
              export PAGESERVER_JWT_TOKEN="$(cat {{ include "neon.authDir" (dict "root" $) }}/pageserverapi.jwt)"
              export SAFEKEEPER_JWT_TOKEN="$(cat {{ include "neon.authDir" (dict "root" $) }}/safekeeperdata.jwt)"
              export CONTROL_PLANE_JWT_TOKEN="$(cat {{ include "neon.authDir" (dict "root" $) }}/admin.jwt)"
              exec /usr/local/bin/storage_controller "$@"
            - storage_controller
          args:
            - --listen=0.0.0.0:{{ $.Values.storageController.port }}
            - --control-plane-url={{ include "neon.ctlURL" $ }}
            # Off by default, and with it off no timeline is ever placed on a safekeeper: no
            # membership, no safekeeper GUC on a compute, and no notification to act on.
            - --timelines-onto-safekeepers
            - --timeline-safekeeper-count={{ $.Values.storageController.timelineSafekeeperCount }}
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secretName }}
                  key: controllerDbPassword
            - name: DATABASE_URL
              value: postgresql://{{ $.Values.controllerDb.user }}:$(DATABASE_PASSWORD)@{{ $db }}:{{ $.Values.controllerDb.port }}/{{ $.Values.controllerDb.database }}
          ports:
            - name: http
              containerPort: {{ $.Values.storageController.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            {{- include "neon.authVolumeMount" (dict "root" $) | nindent 12 }}
          resources:
            {{- toYaml $.Values.storageController.resources | nindent 12 }}
      volumes:
        {{- include "neon.authVolume" (dict "root" $) | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "neon.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "neon.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ $.Values.storageController.port }}
      targetPort: http
