{{- $tag := $.Values.image.tag | default $.Chart.AppVersion }}
{{- $version := 1 }}
{{- if regexMatch "^[0-9]+$" $tag }}{{ $version = atoi $tag }}{{ end }}
{{- $ctx := dict "root" $ "component" "safekeeper-registration" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "neon.fullname" $ctx }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "neon.labels" $ctx | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "neon.selectorLabels" $ctx | nindent 8 }}
    spec:
      enableServiceLinks: false
      restartPolicy: OnFailure
      containers:
        # Pageservers register themselves from a metadata file at startup; safekeepers have no
        # equivalent and exist to the controller only once something posts them. Until all of them
        # are posted, creating a timeline fails for want of a quorum to place it on.
        - name: register
          image: {{ $.Values.registrationImage }}
          command:
            - /bin/sh
            - -ec
            - |
              until curl -sf {{ include "neon.controllerURL" $ }}/status >/dev/null; do
                echo "waiting for the storage controller"
                sleep 5
              done
              {{- range $sk := $.Values.safekeepers }}
              {{- $fullname := include "neon.safekeeperName" (dict "root" $ "id" $sk.id) }}
              curl -sfS -X POST -H 'Content-Type: application/json' \
                {{ include "neon.controllerURL" $ }}/control/v1/safekeeper/{{ $sk.id }} \
                -d '{"id":{{ $sk.id }},"region_id":"{{ $.Values.availabilityZone }}","version":{{ $version }},"host":"{{ $fullname }}.{{ $.Release.Namespace }}.svc.cluster.local","port":{{ $.Values.safekeeper.pgPort }},"http_port":{{ $.Values.safekeeper.httpPort }},"availability_zone_id":"{{ $.Values.availabilityZone }}"}'
              echo " registered safekeeper {{ $sk.id }}"
              {{- end }}
