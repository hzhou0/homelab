# homelab-identity values

# The cookie domain, and so the set of hosts one session covers. Deliberately wider than the
# gateway below: a session is a person, not a route into the cluster.
domain: haustorium.net

# The zone the portal and the directory are published under. The routes themselves are in the
# cilium chart; Authelia still has to know the URL a browser reaches it at.
publishedDomain: haustorium.net

# Created by hand before install, so nothing sensitive reaches the release history.
secretName: identity-credentials

monitoring:
  namespace: monitoring

lldap:
  image:
    repository: ghcr.io/lldap/lldap
    tag: "v0.6.3-alpine"
    pullPolicy: IfNotPresent
  baseDN: dc=haustorium,dc=net
  storage:
    storageClass: zerofs
    size: 5Gi
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi
  nodeSelector: {}

redis:
  image:
    repository: redis
    tag: "8.10.1-alpine"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 192Mi
  nodeSelector: {}

authelia:
  image:
    repository: ghcr.io/authelia/authelia
    tag: "4.39.22"
    pullPolicy: IfNotPresent
  storage:
    storageClass: zerofs
    size: 5Gi
  session:
    expiration: 12h
    inactivity: 1h
    rememberMe: 1M
  # Gmail rewrites any other From to the authenticated account, so the sender and the username are
  # one value; both arrive from the Secret.
  notifier:
    disableStartupCheck: false
    smtp:
      address: 'submissions://smtp.gmail.com:465'

  # How long a verified password stays good for. It bounds how stale a revoked credential can be,
  # against a directory bind per request for clients that hold no session.
  basicAuthCacheLifespan: 5m

  # A rule that asks for a second factor locks out every client presenting a password, since basic
  # auth satisfies one factor and only one.
  accessControl:
    # A published route reaches nobody until it is named below, so forgetting one fails closed.
    defaultPolicy: deny
    rules:
      - domain:
          - home.haustorium.net
          - memos.haustorium.net
          - files.haustorium.net
          - grafana.haustorium.net
        policy: one_factor

      - domain:
          - navidrome.haustorium.net
          - music-files.haustorium.net
        subject: ['group:music']
        policy: one_factor

      # Everyone has an entry of their own to manage here, so no group gates it. What a person may
      # change once inside is the directory's own to enforce.
      - domain:
          - users.haustorium.net
        policy: two_factor

      # A database control plane that believes the identity it is handed, trusted to a narrower set
      # than cluster administration and to a wider one than everybody.
      - domain:
          - neon.haustorium.net
        subject: ['group:neon']
        policy: two_factor

      # Reachable from here is a change to the cluster or to what stores its data, so these are the
      # ones an account is separately trusted with. The group is directory data, created by hand.
      - domain:
          - headlamp.haustorium.net
          - prometheus.haustorium.net
          - hubble.haustorium.net
          - git.haustorium.net
          - argocd.haustorium.net
          - kyverno.internal.haustorium.net
          - seaweedfs.internal.haustorium.net
          - seaweedfs-filer.internal.haustorium.net
        subject: ['group:admins']
        policy: two_factor

      # The surfaces that cannot change anything themselves; Headlamp's limit is the API server's to
      # enforce.
      - domain:
          - headlamp.haustorium.net
          - hubble.haustorium.net
          - kyverno.internal.haustorium.net
        subject: ['group:infra-read']
        policy: two_factor

  # An application that speaks OpenID Connect gets a real session of its own rather than trusting a
  # header, so it is preferred wherever an application supports it.
  oidc:
    enabled: true
    # Nothing can revoke a token the API server has already accepted, so this is also how long a
    # disabled account keeps what its groups grant there.
    lifespans:
      kubernetes:
        id_token: 12h
    # A claim not named here is served from userinfo, which the Kubernetes API server never calls.
    claimsPolicies:
      kubernetes:
        id_token: ['groups', 'preferred_username']
      argocd:
        id_token: ['groups', 'preferred_username', 'email']
    # The digest is not a credential — it is what the plaintext is checked against, and the
    # plaintext belongs wherever the client runs. A client's policy is its own: the rules above
    # gate the route, not the token exchange.
    clients:
      - id: memos
        name: Memos
        secretDigest: "$pbkdf2-sha512$310000$SNoRqt2qeOBhxC07JEl5lw$o0cDoZDQlBVQgcjo4IWldjXvxUB30xjlc7yXv1HULfhDDMSB9Xo/euha9zydoUqWmShcChtcW2.bg.yANCjNsg"
        redirectURIs:
          - https://memos.haustorium.net/auth/callback
      - id: headlamp
        name: Headlamp
        secretDigest: "$pbkdf2-sha512$310000$xSiVF9mL83f/aWsuB20gpA$L2WhvQ4d2l710OOdzUmy99DLF/DpBWXRq9TH845dJxuC/HlqkBZplgqtEwSYDgcuU.EoGSoT7d7iwML/6mGGTw"
        redirectURIs:
          - https://headlamp.haustorium.net/oidc-callback
        claimsPolicy: kubernetes
        # No refresh token: it refreshes from several requests at once, the provider revokes the grant
        # on the second use, and it then retries every request until the rate limit refuses its login.
        lifespan: kubernetes
        scopes: ['openid', 'profile', 'email', 'groups']
        consentMode: implicit
      - id: forgejo
        name: Forgejo
        secretDigest: "$pbkdf2-sha512$310000$TYQRtNkY765RwWXT96kvow$CTDTyTT04wu/2wFkJ1hS/gDMOZWZaejEmnUMuiERvZmI/U.DerUUHTydgbatvj3kf1LlVL0.Un6X8smCKjDXfg"
        redirectURIs:
          - https://git.haustorium.net/user/oauth2/authelia/callback
        scopes: ['openid', 'profile', 'email', 'groups']
        consentMode: implicit
      - id: argocd
        name: Argo CD
        secretDigest: "$pbkdf2-sha512$310000$UCjKyVpa2nZUOeJO8XaSlg$3mDgAe.03EgLjoz8B7t.xl11JUAVWnldmf00FoaRVPVbb0ZsQ/hlVRyzmhgEvWP/Z/EwMicc0l5Q/ohKkkh0zg"
        redirectURIs:
          - https://argocd.haustorium.net/auth/callback
        claimsPolicy: argocd
        scopes: ['openid', 'profile', 'email', 'groups']
        consentMode: implicit
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  nodeSelector: {}
