# homelab-identity values

# The cookie domain, and so the set of hosts one session covers. Deliberately wider than the
# gateway below: a session is a person, not a route into the cluster.
domain: haustorium.net

# The zone the portal and the directory are published under. The routes themselves are in the
# cilium chart; Authelia still has to know the URL a browser reaches it at.
publishedDomain: internal.haustorium.net

# Created by hand before install, so nothing sensitive reaches the release history.
secretName: identity-credentials

monitoring:
  namespace: monitoring

lldap:
  image:
    repository: ghcr.io/lldap/lldap
    tag: "v0.6.3-alpine"
    pullPolicy: IfNotPresent
  baseDN: dc=haustorium,dc=net
  storage:
    storageClass: topolvm-provisioner
    size: 1Gi
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi
  nodeSelector: {}

redis:
  image:
    repository: redis
    tag: "8.10.1-alpine"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 192Mi
  nodeSelector: {}

authelia:
  image:
    repository: ghcr.io/authelia/authelia
    tag: "4.39.22"
    pullPolicy: IfNotPresent
  storage:
    storageClass: topolvm-provisioner
    size: 1Gi
  session:
    expiration: 12h
    inactivity: 1h
    rememberMe: 1M
  # How long a verified password stays good for. It bounds how stale a revoked credential can be,
  # against a directory bind per request for clients that hold no session.
  basicAuthCacheLifespan: 5m

  # A second factor cannot be enrolled without a way to send someone a one-time code, so asking for
  # one would lock every account out of everything. A rule here narrows the default for a named host.
  accessControl:
    defaultPolicy: one_factor
    rules: []
      # - domain: s3.internal.haustorium.net
      #   policy: bypass

  # An application that speaks OpenID Connect gets a real session of its own rather than trusting a
  # header, so it is preferred wherever an application supports it.
  oidc:
    enabled: true
    # The digest is not a credential — it is what the plaintext is checked against, and the
    # plaintext belongs wherever the client runs. Every client is one_factor for the same reason
    # the default policy is.
    clients:
      - id: memos
        name: Memos
        secretDigest: "$pbkdf2-sha512$310000$SNoRqt2qeOBhxC07JEl5lw$o0cDoZDQlBVQgcjo4IWldjXvxUB30xjlc7yXv1HULfhDDMSB9Xo/euha9zydoUqWmShcChtcW2.bg.yANCjNsg"
        redirectURIs:
          - https://memos.internal.haustorium.net/auth/callback
      # Only a login page until the API server trusts this issuer and the deployment stops using
      # its own ServiceAccount: until then every visitor has the same access whoever they are.
      - id: headlamp
        name: Headlamp
        secretDigest: "$pbkdf2-sha512$310000$xSiVF9mL83f/aWsuB20gpA$L2WhvQ4d2l710OOdzUmy99DLF/DpBWXRq9TH845dJxuC/HlqkBZplgqtEwSYDgcuU.EoGSoT7d7iwML/6mGGTw"
        redirectURIs:
          - https://headlamp.internal.haustorium.net/oidc-callback
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  nodeSelector: {}
